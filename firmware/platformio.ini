; JayVeeTV firmware — Waveshare ESP32-C6-Touch-AMOLED-2.16
; Toolchain/platform pinned to one pioarduino release, so builds are reproducible.
;
; Layout: sources live in platform/ and channels/, not the PlatformIO-default
; src/. src_dir = . puts the whole firmware/ tree on the include path (so
; "platform/board.h", "channels/pong/pong.h" etc. resolve from anywhere);
; build_src_filter then picks the directories that hold buildable code
; (its globs reach into subfolders: +<channels/*> builds every channel folder,
; so a new channel needs no change here).
; src_dir is project-wide (platformio.ini's [platformio] section only, not
; per-env) — it is what makes "platform/board.h", "channels/pong/pong.h" etc.
; resolve.
[platformio]
default_envs = release1
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
; Flash size: 16 MB, measured with `esptool flash_id` on the board (2026-09-26).
board_upload.flash_size = 16MB
board_build.partitions = no_ota_16mb.csv
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    -<*>
    +<platform/*>
    +<platform/hw/*>
    +<channels/*>
    +<src/*>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -O2
    -DTV_WIFI_AT_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino
    lewisxhe/XPowersLib
    lewisxhe/SensorLib

; Release 1: stations test card + Pong (firmware/channels/channels.cpp),
; misbehave on (the test card wakes in snow: a knock or 2 s tunes it in). Wi-Fi: AP on
; first boot / nothing saved, home network saved from the remote (NVS), an
; optional gitignored firmware/secrets.h as a dev-only fallback when NVS is
; empty — see docs/NETWORK.md.
[env:release1]
